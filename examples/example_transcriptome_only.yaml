# Transcriptome-only run, umicollapse dedup.
#
# Reads are filtered and then aligned to the bowtie2 transcriptome index to make
# .ribo files. STAR genome alignment is off (genome.run: false), so no genome
# index is needed. RNA-seq is on, but with the genome path off only the RNA-seq
# transcriptome path runs.
#
# Run:
#   nextflow run main.nf -profile default -params-file examples/example_transcriptome_only.yaml

do_fastqc: false
do_check_file_existence: true

# ── Pipeline modules ──────────────────────────────────────────────────────────
do_rnaseq: true
do_strand_split: false   # genome only, so nothing happens while genome.run: false
do_bigwig: false         # genome only, so nothing happens while genome.run: false

# ── Adapter trimming (ribo-seq) ───────────────────────────────────────────────
# The UMI and spacer are removed by umi_tools below, not by cutadapt.
clip_arguments: '-a AAAAAAAAAACAAAAAAAAAA --overlap=4 --trimmed-only --maximum-length=56 --minimum-length=31 --quality-cutoff=28'
# 12-nt UMI + 4-nt spacer at read start.
umi_tools_extract_arguments: "-p \"^(?P<umi_1>.{12})(?P<discard_1>.{4}).+$\" --extract-method=regex"
umicollapse_arguments: ""
dedup_method: "umicollapse"

# ── Alignment ─────────────────────────────────────────────────────────────────
alignment_arguments:
   filter: '-L 15 --no-unal --norc'        # bowtie2 filter flags
   transcriptome: '-L 15 --no-unal --norc' # bowtie2 transcriptome flags

# ── STAR ──────────────────────────────────────────────────────────────────────
# Unused while genome.run: false. Kept here for when you turn the genome path on.
star:
   output_transcriptome_bam: false
   ribo_arguments: '--alignEndsType EndToEnd --seedSearchStartLmax 15 --outFilterType Normal --outFilterMultimapNmax 20 --alignSJDBoverhangMin 1 --outFilterMismatchNoverReadLmax 0.04 --winAnchorMultimapNmax 150'
   rnaseq_arguments: '--outFilterType BySJout --outFilterMultimapNmax 20 --alignSJoverhangMin 8 --alignSJDBoverhangMin 1 --outFilterMismatchNmax 999 --outFilterMismatchNoverReadLmax 0.04 --alignIntronMin 20 --alignIntronMax 1000000 --alignMatesGapMax 1000000'
   #
   # Only used when genome_fasta + gtf are set below:
   #   sjdb_overhang: 28          # read length - 1
   #   index_dir: /path/to/cache  # built index is reused across runs
   #   index_args: ''             # extra genomeGenerate flags

# ── Alignment path selection ──────────────────────────────────────────────────
# genome.run and transcriptome.run are independent. Here genome is off and
# transcriptome is on.
genome:
  run: false
  unique_only: true   # keep uniquely-mapping reads only (-q 255)
  mapping_quality_cutoff: 255   # -q, used only when unique_only: false
  samtools_filter_arguments: "-F 2308"   # unused while run: false
  #
  # Optional. How stats.csv counts the kept reads; does not change the BAM.
  # Defaults shown; only used when unique_only: false.
  # samtools_count_arguments:
  #   primary:   "-F 2304"
  #   secondary: "-f 256"
  #   unique:    "-q 255 -F 2304"

# ── Bowtie2 transcriptome → .ribo ─────────────────────────────────────────────
transcriptome:
  run: true
  mapping_quality_cutoff: 10   # 10=confident, 20=strict, 40=unique only
  samtools_filter_arguments: "-F 2308"   # drop unmapped + secondary + supplementary
  # samtools view read-filtering args. -q is not accepted here.

ribo:
  ref_name: appris_human_v3
  metagene_radius: 50
  left_span: 35
  right_span: 15
  read_length:
    min: 15                # 31 nt clip floor - 16 nt UMI + spacer
    max: 40                # 56 nt clip ceiling - 16 nt UMI + spacer
  coverage: true

  # ── Metadata embedded into .ribo files ───────────────────────────────────
  # ribometa: one YAML describing the .ribo file itself. The same file is used
  #   for every sample (ribopy create --ribometa).
  # metadata.files: one YAML per sample describing that experiment, e.g. cell
  #   line, treatment, batch (ribopy create --expmeta).
  ribometa: ./examples/example_transcriptome_only.yaml

  metadata:
    base: ./meta                       # path prefix for the files below
    files:
      GSM8325903: GSM8325903.yaml
      GSM8325907: GSM8325907.yaml

# ── RNA-seq path ──────────────────────────────────────────────────────────────
# Single-end. Sample IDs must match the ribo-seq IDs so the two are joined.
# rnaseq.genome.* is unused here because the genome path is off.
rnaseq:
  fastq_base: ""
  clip_arguments: '-u 1 --quality-cutoff=28 --minimum-length=20'
  filter_arguments: '-L 15 --no-unal'
  dedup_method: "position"          # position | none | umicollapse
  umi_tools_extract_arguments: ""
  genome:
    unique_only: true               # keep uniquely-mapping reads only (-q 255)
    mapping_quality_cutoff: 255     # -q, used only when unique_only: false
    samtools_filter_arguments: "-F 2308"
    # Optional. Defaults shown; only used when unique_only: false.
    # The paired_end keys apply automatically to paired-end input.
    # samtools_count_arguments:
    #   primary:   "-F 2304"
    #   secondary: "-f 256"
    #   unique:    "-q 255 -F 2304"
    #   paired_end_fragment:  "-f 64"   # count R1 only, so counts are per fragment
    #   paired_end_secondary: "-f 320"
  transcriptome:
    mapping_quality_cutoff: 10
    samtools_filter_arguments: "-F 2308"
    alignment_arguments: '-L 15 --no-unal'
  fastq:
    GSM8325903:
      - ./rf_sample_data/fastq/rnaseq/GSM8325891/SRR29385983.fastq.gz
    GSM8325907:
      - ./rf_sample_data/fastq/rnaseq/GSM8325895/SRR29385979.fastq.gz

# ── Output directories ────────────────────────────────────────────────────────
output:
   individual_lane_directory: 'individual'
   merged_lane_directory: 'merged'
   intermediates:
      base: 'transcriptome_only_intermediates'
      clip: 'clip'
      log: 'log'
      transcriptome_alignment: 'transcriptome_alignment'
      filter: 'filter'
      genome_alignment: 'genome_alignment'
      bam_to_bed: 'bam_to_bed'
      quality_filter: 'quality_filter'
      alignment_ribo: 'alignment_ribo'
   output:
      base: 'transcriptome_only_output'
      log: 'log'
      fastqc: 'fastqc'
      stats: 'stats'
      bigwigs: 'bigwigs'
      alignments: 'alignments'
      ribo: 'ribo'

# ── Input — references and FASTQs (ribo-seq) ──────────────────────────────────
input:
   reference:
      filter: ./references_for_riboflow/filter/human/v2/human_rtRNA*

      # No STAR genome index is needed while genome.run: false. To turn the
      # genome path on, set genome.run: true above and provide one of:
      #   Mode A, pre-built index:  genome: ./rf_sample_data/genome
      #   Mode B, build from FASTA: genome_fasta + gtf, and set star.sjdb_overhang
      # genome: ./rf_sample_data/genome
      # genome_fasta: /path/to/GRCh38.primary_assembly.genome.fa
      # gtf:          /path/to/gencode.v48.annotation.gtf

      transcriptome: ./references_for_riboflow/transcriptome/human/v3/riboflow_annot_and_ref/appris_human_v3_selected*
      regions: ./references_for_riboflow/transcriptome/human/v3/riboflow_annot_and_ref/appris_human_v3_actual_regions.bed
      transcript_lengths: ./references_for_riboflow/transcriptome/human/v3/riboflow_annot_and_ref/appris_human_v3_transcript_lengths.tsv

   fastq_base: ""

   fastq:
      GSM8325903:
        - ./rf_sample_data/fastq/ribosome_profiling/GSM8325903/SRR29385971.fastq.gz
      GSM8325907:
        - ./rf_sample_data/fastq/ribosome_profiling/GSM8325907/SRR29385967.fastq.gz
