##########################################################################
#####  Build-from-FASTA (MODE B) — pipeline generates the STAR index  #####
##########################################################################
#
# Purpose: the only example that runs `STAR --runMode genomeGenerate`. Every other
# example consumes a pre-built index directory (MODE A). Nothing here names a
# chromosome — it builds whatever is currently in genome_source/genome.{fa,gtf} and
# writes the result to the one path all the other examples read.
#
# The shipped reference is chrM (16 kb), which is what fits in the sample data repo as
# a real GitHub repository, and genomeGenerate finishes in seconds.
#
# IMPORTANT — this really does build an index: STAR_INDEX runs genomeGenerate and the
# alignments in THIS run use the index it just built. Verified 2026-07-30 under
# -profile docker: genomeGenerate ran with --sjdbOverhang 28 and exited 0.
#
# The index now PERSISTS to build_index_intermediates/star_index (see the index_dir
# note below), so it survives a work/ clean and is reused on re-run.
#
# HISTORICAL NOTE, because this file used to say the opposite: the earlier claim was
# that "neither storeDir nor publishDir places it at star.index_dir, so it is lost
# when work/ is cleaned". That was an accurate observation of a real bug, but the
# cause was not a missing storeDir — conf/modules.config:67 always declared one.
# conf/default.config declared `withName: 'STAR_INDEX'`, the same bare key, and the
# resolved config for that selector then contained only cpus/memory/maxForks: the
# storeDir was dropped. Both resource profiles now use `.*STAR_INDEX`, a different
# key matching the same process, so the two coexist and the index is stored again.
# See the long comment at that selector in conf/default.config for the exact scope of
# the claim (it is narrower than "last-loaded wins").
#
# The four Mode A examples still read the committed copy; to refresh that shared
# artifact deliberately, use the sample data repo's own builder:
#
#   ./rf_sample_data/genome/make_index.sh
#
# To move up to a larger reference (e.g. chr1 — 249 Mb, ~5,600 genes, real splice
# junctions and multi-mappers), replace the FASTA/GTF pair in place, then rebuild the
# shared index:
#
#   ./rf_sample_data/genome/make_index.sh
#
# and every other example picks up the rebuilt index unchanged. No YAML edits: STAR's
# --genomeSAindexNbases is derived from the FASTA length by both make_index.sh and
# modules/local/star_index.nf (6 for chrM, 12 for chr1, 14 for a whole assembly).
#
# The genome FASTA (.fa) and annotation (.gtf) must be uncompressed (not .gz).
#
# Run:
#   nextflow run main.nf -profile default,docker -params-file example_build_index.yaml
#
# The `docker` profile is not optional on macOS: STAR does not run natively there.
#
# Inputs come from the sample data repo cloned in Quickstart step 4. The GSE269734 FASTQs
# ship preselected — reads that align to the shipped reference — so a 16 kb index still
# yields non-degenerate .ribo files.
#
# Verify the index the CONSUMERS use (built by make_index.sh, not by this run):
#   ls rf_sample_data/genome/star_index/   # SA, SAindex, Genome, chrNameLength.txt
#
# Re-run cheaply with -resume (Nextflow task cache; STAR_INDEX is not re-executed):
#   nextflow run main.nf -profile default,docker \
#       -params-file example_build_index.yaml -resume
#
##########################################################################

do_fastqc: false
do_check_file_existence: true

# ── Pipeline modules ──────────────────────────────────────────────────────────
do_rnaseq: true         # RNA-seq reads aligned to the same index, merged into the .ribo
do_strand_split: false
do_bigwig: false        # strand-specific bigWig coverage tracks (deepTools); off by default

# ── Adapter trimming (ribo-seq) ───────────────────────────────────────────────
# GSE269734 library layout: 12 nt UMI + 4 nt discard at the 5' end, poly-A adapter
# at the 3' end. Order in subworkflows/local/preprocess.nf is CUTADAPT_CLIP ->
# UMITOOLS_EXTRACT -> BOWTIE2_FILTER, so the 31-56 nt clip window becomes 15-40 nt
# after the 16 nt UMI block is removed — matching ribo.read_length below.
clip_arguments: '-a AAAAAAAAAACAAAAAAAAAA --overlap=4 --trimmed-only --maximum-length=56 --minimum-length=31 --quality-cutoff=28'
dedup_method: "umicollapse"
umi_tools_extract_arguments: '-p "^(?P<umi_1>.{12})(?P<discard_1>.{4}).+$" --extract-method=regex'
umicollapse_arguments: ""

# ── Alignment ─────────────────────────────────────────────────────────────────
alignment_arguments:
   filter: '-L 15 --no-unal --norc'          # bowtie2 filter flags (active)
   transcriptome: '-L 15 --no-unal --norc'   # bowtie2 transcriptome flags (transcriptome.run: true)

star:
   output_transcriptome_bam: false
   ribo_arguments: '--alignEndsType EndToEnd --seedSearchStartLmax 15 --outFilterType Normal --outFilterMultimapNmax 20 --alignSJDBoverhangMin 1 --outFilterMismatchNoverReadLmax 0.04 --winAnchorMultimapNmax 150'
   # RNA-seq: ENCODE flags; multimappers retained here, unique-only enforced downstream.
   rnaseq_arguments: '--outFilterType BySJout --outFilterMultimapNmax 20 --alignSJoverhangMin 8 --alignSJDBoverhangMin 1 --outFilterMismatchNmax 999 --outFilterMismatchNoverReadLmax 0.04 --alignIntronMin 20 --alignIntronMax 1000000 --alignMatesGapMax 1000000'

   # ── Index-generation settings (MODE B — build-from-FASTA) ───────────────────
   # These are only used because genome_fasta + gtf are set below (Mode B).
   # In Mode A (pre-built index via 'genome:'), these three lines are ignored.
   sjdb_overhang: 28                          # sized for the 15-40 nt ribo-seq footprints
   # index_args: ''                           # --genomeSAindexNbases is auto-derived from the
                                              # FASTA length; set it here only to override.
   # index_dir intentionally UNSET. STAR_INDEX's storeDir (conf/modules.config:67)
   # falls back to <output.intermediates.base>/star_index, i.e.
   # build_index_intermediates/star_index — run-local, and cleaned up with the rest
   # of this example's output.
   #
   # It used to be `./rf_sample_data/genome`, which is the directory the
   # SHIPPED prebuilt chrM index lives in and that the other four examples read.
   # That is unsafe in both directions: storeDir skips a task whose outputs already
   # exist, so with the committed star_index/ present this example would quietly
   # skip genomeGenerate and prove nothing — and if it did run, it would overwrite
   # the shared index the Mode A examples depend on.
   #
   # To deliberately refresh that shared artifact, use the sample data repo's own
   # builder instead: ./rf_sample_data/genome/make_index.sh
   # index_dir: /path/to/persistent/index/cache

# ── Alignment path selection ──────────────────────────────────────────────────
genome:
  run: true
  unique_only: true   # FILTER: keep uniquely-mapping reads only (-q 255); stats use the unique-only layout
  mapping_quality_cutoff: 255   # FILTER -q, used only when unique_only: false
  samtools_filter_arguments: "-F 2308"   # exclude unmapped(4)+secondary(256)+supplementary(2048)
  # ^ any samtools view read-filtering args (-f/-F/-G/-e/-d/-L/-s/…). -q is NOT
  #   accepted here: unique_only / mapping_quality_cutoff own the MAPQ filter and the stats mode.
  # OPTIONAL — unused while unique_only: true, and these are the defaults anyway:
  # samtools_count_arguments:          # how stats.csv COUNTS the kept reads (samtools view -c); no effect on the BAM
  #   primary:   "-F 2304"             #   one record per aligned read (not secondary/supplementary)
  #   secondary: "-f 256"              #   extra alignments of multi-mappers
  #   unique:    "-q 255 -F 2304"      #   what the unique/multi breakdown calls "unique" (STAR MAPQ 255);
  #                                    #   only used when unique_only: false

# ── Transcriptome path (bowtie2, whole transcriptome) ────────────────────────
# Independent of the genome reference: the appris index covers all chromosomes, so this
# arm gives a normal alignment rate and a cross-check on the genome arm.
transcriptome:
  run: true
  mapping_quality_cutoff: 42    # bowtie2: 10=confident; 20=more strict; 40+=unique only
  samtools_filter_arguments: "-F 2308"   # own key — no longer inherits the genome route's mask

# ── ribopy .ribo settings ─────────────────────────────────────────────────────
ribo:
  ref_name: appris_human_v3
  metagene_radius: 50
  left_span: 35
  right_span: 10
  read_length:
    min: 15
    max: 40
  coverage: true
  # ── Optional metadata embedded into .ribo files ───────────────────────────
  # ribometa: ./example_build_index.yaml  # global: same YAML embedded in every .ribo
  #
  # metadata:                                # per-sample: different YAML per sample
  #   base: ""                               # optional path prefix for all files below
  #   files:
  #     GSM8325903: ./meta/GSM8325903.yaml   # sample name must match input.fastq key
  #     GSM8325907: ./meta/GSM8325907.yaml

# ── Input — FASTA+GTF (triggers STAR_INDEX) + GSE269734 ribo-seq FASTQs ──
input:
   reference:
      filter: ./references_for_riboflow/filter/human/v2/human_rtRNA*

      # ── STAR genome index — MODE B (build from FASTA+GTF) ────────────────────
      # 'genome' is absent here — presence of genome_fasta triggers index generation.
      # To switch to MODE A (pre-built index): remove genome_fasta + gtf, add:
      #   genome: /path/to/existing/index_dir
      genome_fasta: ./rf_sample_data/genome/genome_source/genome.fa
      gtf:          ./rf_sample_data/genome/genome_source/genome.gtf

      transcriptome:      ./references_for_riboflow/transcriptome/human/v3/riboflow_annot_and_ref/appris_human_v3_selected*
      regions:            ./references_for_riboflow/transcriptome/human/v3/riboflow_annot_and_ref/appris_human_v3_actual_regions.bed
      transcript_lengths: ./references_for_riboflow/transcriptome/human/v3/riboflow_annot_and_ref/appris_human_v3_transcript_lengths.tsv

   fastq_base: ""

   fastq:
      GSM8325903:
        - ./rf_sample_data/fastq/ribosome_profiling/GSM8325903/SRR29385971.fastq.gz
      GSM8325907:
        - ./rf_sample_data/fastq/ribosome_profiling/GSM8325907/SRR29385967.fastq.gz

# ── RNA-seq path ──────────────────────────────────────────────────────────────
rnaseq:
  fastq_base: ""
  clip_arguments: '-u 1 --quality-cutoff=28 --minimum-length=20'
  filter_arguments: '-L 15 --no-unal'
  dedup_method: "none"              # position | none | umicollapse (SE only)
  umi_tools_extract_arguments: ""
  genome:
    unique_only: true               # FILTER: unique reads only (-q 255); cutoff below is then ignored
    mapping_quality_cutoff: 255     # FILTER -q, used only when unique_only: false
    samtools_filter_arguments: "-F 2308"   # exclude unmapped(4)+secondary(256)+supplementary(2048)
    # OPTIONAL — unused while unique_only: true; defaults shown (PE keys apply automatically):
    # samtools_count_arguments:        # how stats.csv COUNTS the kept reads; PE keys exist only here
    #   primary:   "-F 2304"          #   one record per aligned read
    #   secondary: "-f 256"           #   extra alignments of multi-mappers
    #   unique:    "-q 255 -F 2304"   #   definition of "unique" in the breakdown; used only when unique_only: false
    #   paired_end_fragment:  "-f 64"  #   PE: count R1 only, so counts are per fragment not per mate
    #   paired_end_secondary: "-f 320" #   PE: secondary records, R1 only
  transcriptome:
    mapping_quality_cutoff: 42
    samtools_filter_arguments: "-F 2308"
    alignment_arguments: '-L 15 --no-unal'
  fastq:
    # Sample names MUST match the ribo-seq sample names above so RIBOPY_RNASEQ_SET
    # can merge the RNA-seq BED into the matching .ribo — hence the GSM8325903 /
    # GSM8325907 keys pointing at the GSM8325891 / GSM8325895 RNA-seq accessions.
    #
    # SE lane = a plain string; PE lane = a 2-element [R1, R2] list.
    GSM8325903:
      - ./rf_sample_data/fastq/rnaseq/GSM8325891/SRR29385983.fastq.gz
    GSM8325907:
      - ./rf_sample_data/fastq/rnaseq/GSM8325895/SRR29385979.fastq.gz

# ── Output directories ────────────────────────────────────────────────────────
output:
   individual_lane_directory: 'individual'
   merged_lane_directory: 'merged'
   intermediates:
      base: 'build_index_intermediates'
      clip: 'clip'
      log: 'log'
      transcriptome_alignment: 'transcriptome_alignment'
      filter: 'filter'
      genome_alignment: 'genome_alignment'
      bam_to_bed: 'bam_to_bed'
      quality_filter: 'quality_filter'
      alignment_ribo: 'alignment_ribo'
   output:
      base: 'build_index_output'
      log: 'log'
      fastqc: 'fastqc'
      stats: 'stats'
      bigwigs: 'bigwigs'
      alignments: 'alignments'
      ribo: 'ribo'
