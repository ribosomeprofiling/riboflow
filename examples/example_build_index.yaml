# Build the STAR index from FASTA + GTF, then run the pipeline against it.
#
# Setting input.reference.genome_fasta and gtf (instead of a pre-built
# input.reference.genome directory) makes the pipeline run
# STAR --runMode genomeGenerate first. The index is written to
# build_index_intermediates/star_index and reused on re-run.
#
# The genome FASTA and GTF must be uncompressed.
#
# The other examples read the pre-built index in rf_sample_data/genome/star_index.
# To rebuild that shared index, use ./rf_sample_data/genome/make_index.sh instead
# of this file.
#
# Run:
#   nextflow run main.nf -profile default,docker -params-file examples/example_build_index.yaml
#   nextflow run main.nf -profile defualt, -params-file examples/example_build_index.yaml

do_fastqc: false
do_check_file_existence: true

# ── Pipeline modules ──────────────────────────────────────────────────────────
do_rnaseq: true
do_strand_split: false
do_bigwig: false        # strand-specific bigWig coverage tracks

# ── Adapter trimming (ribo-seq) ───────────────────────────────────────────────
# 12-nt UMI + 4-nt spacer at the 5' end, poly-A adapter at the 3' end. Trimming
# order is cutadapt, then umi_tools, then the bowtie2 filter, so the 31-56 nt clip
# window becomes 15-40 nt once the 16 nt UMI block is removed. That matches
# ribo.read_length below.
clip_arguments: '-a AAAAAAAAAACAAAAAAAAAA --overlap=4 --trimmed-only --maximum-length=56 --minimum-length=31 --quality-cutoff=28'
dedup_method: "umicollapse"
umi_tools_extract_arguments: '-p "^(?P<umi_1>.{12})(?P<discard_1>.{4}).+$" --extract-method=regex'
umicollapse_arguments: ""

# ── Alignment ─────────────────────────────────────────────────────────────────
alignment_arguments:
   filter: '-L 15 --no-unal --norc'          # bowtie2 filter flags
   transcriptome: '-L 15 --no-unal --norc'   # bowtie2 transcriptome flags

star:
   output_transcriptome_bam: false
   ribo_arguments: '--alignEndsType EndToEnd --seedSearchStartLmax 15 --outFilterType Normal --outFilterMultimapNmax 20 --alignSJDBoverhangMin 1 --outFilterMismatchNoverReadLmax 0.04 --winAnchorMultimapNmax 150'
   rnaseq_arguments: '--outFilterType BySJout --outFilterMultimapNmax 20 --alignSJoverhangMin 8 --alignSJDBoverhangMin 1 --outFilterMismatchNmax 999 --outFilterMismatchNoverReadLmax 0.04 --alignIntronMin 20 --alignIntronMax 1000000 --alignMatesGapMax 1000000'

   # ── Index generation ────────────────────────────────────────────────────────
   # Used because genome_fasta + gtf are set below.
   sjdb_overhang: 28                # sized for 15-40 nt ribo-seq footprints
   # index_args: ''                 # --genomeSAindexNbases is derived from the
                                    # FASTA length; set this only to override it.
   #
   # index_dir is unset, so the index goes to
   # <output.intermediates.base>/star_index and is cleaned up with the rest of
   # this example's output. Set it to keep the index somewhere permanent.
   # index_dir: /path/to/persistent/index/cache

# ── Alignment path selection ──────────────────────────────────────────────────
genome:
  run: true
  unique_only: true   # keep uniquely-mapping reads only (-q 255)
  mapping_quality_cutoff: 255   # -q, used only when unique_only: false
  samtools_filter_arguments: "-F 2308"   # drop unmapped + secondary + supplementary
  # samtools view read-filtering args. -q is not accepted here; unique_only and
  # mapping_quality_cutoff control the MAPQ filter.
  #
  # Optional. How stats.csv counts the kept reads; does not change the BAM.
  # Defaults shown; only used when unique_only: false.
  # samtools_count_arguments:
  #   primary:   "-F 2304"
  #   secondary: "-f 256"
  #   unique:    "-q 255 -F 2304"

# ── Transcriptome path (bowtie2) ──────────────────────────────────────────────
# Independent of the genome reference, so it also acts as a cross-check.
transcriptome:
  run: true
  mapping_quality_cutoff: 42    # 10=confident, 20=strict, 40+=unique only
  samtools_filter_arguments: "-F 2308"

# ── ribopy .ribo settings ─────────────────────────────────────────────────────
ribo:
  ref_name: appris_human_v3
  metagene_radius: 50
  left_span: 35
  right_span: 10
  read_length:
    min: 15
    max: 40
  coverage: true
  # ── Optional metadata embedded into .ribo files ───────────────────────────
  # ribometa: one YAML describing the .ribo file itself, used for every sample.
  # metadata.files: one YAML per sample describing that experiment. The sample
  #   name must match the input.fastq key.
  #
  # ribometa: ./examples/example_build_index.yaml
  #
  # metadata:
  #   base: ""
  #   files:
  #     GSM8325903: ./meta/GSM8325903.yaml
  #     GSM8325907: ./meta/GSM8325907.yaml

# ── Input — references and FASTQs (ribo-seq) ──────────────────────────────────
input:
   reference:
      filter: ./references_for_riboflow/filter/human/v2/human_rtRNA*

      # 'genome' is absent; genome_fasta + gtf trigger index generation. To use a
      # pre-built index instead, drop these two keys and set:
      #   genome: /path/to/existing/index_dir
      genome_fasta: ./rf_sample_data/genome/genome_source/genome.fa
      gtf:          ./rf_sample_data/genome/genome_source/genome.gtf

      transcriptome:      ./references_for_riboflow/transcriptome/human/v3/riboflow_annot_and_ref/appris_human_v3_selected*
      regions:            ./references_for_riboflow/transcriptome/human/v3/riboflow_annot_and_ref/appris_human_v3_actual_regions.bed
      transcript_lengths: ./references_for_riboflow/transcriptome/human/v3/riboflow_annot_and_ref/appris_human_v3_transcript_lengths.tsv

   fastq_base: ""

   fastq:
      GSM8325903:
        - ./rf_sample_data/fastq/ribosome_profiling/GSM8325903/SRR29385971.fastq.gz
      GSM8325907:
        - ./rf_sample_data/fastq/ribosome_profiling/GSM8325907/SRR29385967.fastq.gz

# ── RNA-seq path ──────────────────────────────────────────────────────────────
rnaseq:
  fastq_base: ""
  clip_arguments: '-u 1 --quality-cutoff=28 --minimum-length=20'
  filter_arguments: '-L 15 --no-unal'
  dedup_method: "none"              # position | none | umicollapse
  umi_tools_extract_arguments: ""
  genome:
    unique_only: true               # keep uniquely-mapping reads only (-q 255)
    mapping_quality_cutoff: 255     # -q, used only when unique_only: false
    samtools_filter_arguments: "-F 2308"
    # Optional. Defaults shown; only used when unique_only: false.
    # The paired_end keys apply automatically to paired-end input.
    # samtools_count_arguments:
    #   primary:   "-F 2304"
    #   secondary: "-f 256"
    #   unique:    "-q 255 -F 2304"
    #   paired_end_fragment:  "-f 64"   # count R1 only, so counts are per fragment
    #   paired_end_secondary: "-f 320"
  transcriptome:
    mapping_quality_cutoff: 42
    samtools_filter_arguments: "-F 2308"
    alignment_arguments: '-L 15 --no-unal'
  fastq:
    # Sample names must match the ribo-seq sample names above so the RNA-seq BED
    # is merged into the matching .ribo file.
    #
    # A single-end lane is a plain string; a paired-end lane is an [R1, R2] list.
    GSM8325903:
      - ./rf_sample_data/fastq/rnaseq/GSM8325891/SRR29385983.fastq.gz
    GSM8325907:
      - ./rf_sample_data/fastq/rnaseq/GSM8325895/SRR29385979.fastq.gz

# ── Output directories ────────────────────────────────────────────────────────
output:
   individual_lane_directory: 'individual'
   merged_lane_directory: 'merged'
   intermediates:
      base: 'build_index_intermediates'
      clip: 'clip'
      log: 'log'
      transcriptome_alignment: 'transcriptome_alignment'
      filter: 'filter'
      genome_alignment: 'genome_alignment'
      bam_to_bed: 'bam_to_bed'
      quality_filter: 'quality_filter'
      alignment_ribo: 'alignment_ribo'
   output:
      base: 'build_index_output'
      log: 'log'
      fastqc: 'fastqc'
      stats: 'stats'
      bigwigs: 'bigwigs'
      alignments: 'alignments'
      ribo: 'ribo'
