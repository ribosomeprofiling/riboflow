# Ribo-seq + RNA-seq, position dedup.
#
# Runs the ribo-seq genome and bowtie2 transcriptome paths into .ribo files,
# plus the parallel RNA-seq genome and transcriptome paths. When do_rnaseq and
# transcriptome.run are both true, the RNA-seq transcriptome BED is merged into
# the ribo-seq .ribo files.
#
# The rnaseq.fastq entries below point at the same FASTQs as the ribo-seq input,
# which only exercises the wiring. Point them at real RNA-seq runs.
#
# Run:
#   nextflow run main.nf -profile default -params-file examples/example_position_multi.yaml

do_fastqc: false
do_check_file_existence: true

# ── Pipeline modules ──────────────────────────────────────────────────────────
do_rnaseq: true
do_strand_split: true
do_bigwig: false        # strand-specific bigWig coverage tracks

# ── Adapter trimming (ribo-seq) ───────────────────────────────────────────────
clip_arguments: '-u 1 -a CTGTAGGCACCATCAAT --overlap=4 --trimmed-only --maximum-length=40 --minimum-length=15 --quality-cutoff=28'
dedup_method: "position"
umi_tools_extract_arguments: ""
umicollapse_arguments: ""

# ── Alignment ─────────────────────────────────────────────────────────────────
alignment_arguments:
   filter: '-L 15 --no-unal --norc'        # bowtie2 filter flags
   transcriptome: '-L 15 --no-unal --norc' # bowtie2 transcriptome flags

star:
   output_transcriptome_bam: false
   ribo_arguments: '--alignEndsType EndToEnd --seedSearchStartLmax 15 --outFilterType Normal --outFilterMultimapNmax 20 --alignSJDBoverhangMin 1 --outFilterMismatchNoverReadLmax 0.04 --winAnchorMultimapNmax 150'
   rnaseq_arguments: '--outFilterType BySJout --outFilterMultimapNmax 20 --alignSJoverhangMin 8 --alignSJDBoverhangMin 1 --outFilterMismatchNmax 999 --outFilterMismatchNoverReadLmax 0.04 --alignIntronMin 20 --alignIntronMax 1000000 --alignMatesGapMax 1000000'
   #
   # Only used when genome_fasta + gtf are set below:
   #   sjdb_overhang: 28          # read length - 1
   #   index_dir: /path/to/cache  # built index is reused across runs
   #   index_args: ''             # extra genomeGenerate flags

# ── Alignment path selection ──────────────────────────────────────────────────
genome:
  run: true
  unique_only: true   # keep uniquely-mapping reads only (-q 255)
  mapping_quality_cutoff: 255   # -q, used only when unique_only: false
  samtools_filter_arguments: "-F 2308"   # drop unmapped + secondary + supplementary
  # samtools view read-filtering args. -q is not accepted here; unique_only and
  # mapping_quality_cutoff control the MAPQ filter.
  #
  # Optional. How stats.csv counts the kept reads; does not change the BAM.
  # Defaults shown; only used when unique_only: false.
  # samtools_count_arguments:
  #   primary:   "-F 2304"
  #   secondary: "-f 256"
  #   unique:    "-q 255 -F 2304"

# ── Bowtie2 transcriptome → .ribo ─────────────────────────────────────────────
transcriptome:
  run: true
  mapping_quality_cutoff: 10   # 10=confident, 20=strict, 40=unique only
  samtools_filter_arguments: "-F 2308"

ribo:
  ref_name: appris_human_v3
  metagene_radius: 50
  left_span: 35
  right_span: 15
  read_length:
    min: 15
    max: 35
  coverage: true
  # ── Optional metadata embedded into .ribo files ───────────────────────────
  # ribometa: one YAML describing the .ribo file itself, used for every sample.
  # metadata.files: one YAML per sample describing that experiment. The sample
  #   name must match the input.fastq key. Write these yourself; meta/ ships
  #   only GSM8325903 and GSM8325907.
  #
  # ribometa: ./examples/example_position_multi.yaml
  #
  # metadata:
  #   base: ""
  #   files:
  #     GSM1606107: ./meta/GSM1606107.yaml
  #     GSM1606108: ./meta/GSM1606108.yaml

# ── Input — references and FASTQs (ribo-seq) ──────────────────────────────────
input:
   reference:
      filter: ./references_for_riboflow/filter/human/v2/human_rtRNA*

      # STAR genome index — pick one of the two modes.
      #
      # Mode A, pre-built index: set 'genome' to the index directory and leave
      # genome_fasta and gtf unset.
      genome: ./rf_sample_data/genome/star_index
      #
      # Mode B, build from FASTA + GTF: comment out 'genome' above, uncomment the
      # two lines below, and set star.sjdb_overhang.
      # genome_fasta: /path/to/GRCh38.primary_assembly.genome.fa
      # gtf:          /path/to/gencode.v48.annotation.gtf

      transcriptome: ./references_for_riboflow/transcriptome/human/v3/riboflow_annot_and_ref/appris_human_v3_selected*
      regions: ./references_for_riboflow/transcriptome/human/v3/riboflow_annot_and_ref/appris_human_v3_actual_regions.bed
      transcript_lengths: ./references_for_riboflow/transcriptome/human/v3/riboflow_annot_and_ref/appris_human_v3_transcript_lengths.tsv

   fastq_base: ""

   fastq:
      GSM1606107:
        - ./rf_sample_data/fastq/ribosome_profiling/GSM1606107/SRR1795425.fastq.gz
        - ./rf_sample_data/fastq/ribosome_profiling/GSM1606107/SRR1795426.fastq.gz
      GSM1606108:
        - ./rf_sample_data/fastq/ribosome_profiling/GSM1606108/SRR1795427.fastq.gz
        - ./rf_sample_data/fastq/ribosome_profiling/GSM1606108/SRR1795428.fastq.gz


# ── RNA-seq path ──────────────────────────────────────────────────────────────
rnaseq:
  fastq_base: ""
  clip_arguments: '-u 1 --quality-cutoff=28 --minimum-length=20'
  filter_arguments: '-L 15 --no-unal'
  dedup_method: "position"          # position | none | umicollapse
  umi_tools_extract_arguments: ""
  genome:
    unique_only: true               # keep uniquely-mapping reads only (-q 255)
    mapping_quality_cutoff: 255     # -q, used only when unique_only: false
    samtools_filter_arguments: "-F 2308"
    # Optional. Defaults shown; only used when unique_only: false.
    # The paired_end keys apply automatically to paired-end input.
    # samtools_count_arguments:
    #   primary:   "-F 2304"
    #   secondary: "-f 256"
    #   unique:    "-q 255 -F 2304"
    #   paired_end_fragment:  "-f 64"   # count R1 only, so counts are per fragment
    #   paired_end_secondary: "-f 320"
  transcriptome:
    mapping_quality_cutoff: 10
    samtools_filter_arguments: "-F 2308"
    alignment_arguments: '-L 15 --no-unal'
  fastq:
    # Sample names must match the ribo-seq sample names so the RNA-seq BED is
    # merged into the matching .ribo file.
    #
    # A single-end lane is a plain string; a paired-end lane is an [R1, R2] list.
    GSM1606107:
      - ./rf_sample_data/fastq/ribosome_profiling/GSM1606107/SRR1795425.fastq.gz
      - ./rf_sample_data/fastq/ribosome_profiling/GSM1606107/SRR1795426.fastq.gz
    GSM1606108:
      - ./rf_sample_data/fastq/ribosome_profiling/GSM1606108/SRR1795427.fastq.gz
      - ./rf_sample_data/fastq/ribosome_profiling/GSM1606108/SRR1795428.fastq.gz

# ── Output directories ────────────────────────────────────────────────────────
output:
   individual_lane_directory: 'individual'
   merged_lane_directory: 'merged'
   intermediates:
      base: 'position_intermediates'
      clip: 'clip'
      log: 'log'
      transcriptome_alignment: 'transcriptome_alignment'
      filter: 'filter'
      genome_alignment: 'genome_alignment'
      bam_to_bed: 'bam_to_bed'
      quality_filter: 'quality_filter'
      alignment_ribo: 'alignment_ribo'
   output:
      base: 'position_output'
      log: 'log'
      fastqc: 'fastqc'
      stats: 'stats'
      bigwigs: 'bigwigs'
      alignments: 'alignments'
      ribo: 'ribo'
