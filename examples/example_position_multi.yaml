##########################################################################
#####   RNA-seq + ribo-seq example — position dedup, human v2/v3 refs   #####
##########################################################################
#
# Full pipeline: ribo-seq genome + bowtie2 transcriptome → .ribo, PLUS the
# parallel RNA-seq genome + transcriptome path. When both do_rnaseq and
# transcriptome.run are true, the RNA-seq transcriptome BED is merged into the
# ribo-seq .ribo files via `ribopy rnaseq set`.
#
#   Filter:        references_for_riboflow/filter/human/v2
#   Transcriptome: references_for_riboflow/transcriptome/human/v3
#   Genome:        rf_sample_data/genome/star_index  (prebuilt, ships in-repo)
#
# NOTE: the rnaseq.fastq below point at the SAME ribo-seq FASTQs purely for a
# wiring smoke test. Real users should point rnaseq.fastq at actual RNA-seq runs.
# PE RNA-seq + dedup_method: umicollapse is NOT supported (use position or none).
#
# Run:
#   nextflow run main.nf -profile default -params-file example_position_multi.yaml
#
##########################################################################

do_fastqc: false
do_check_file_existence: true

# ── Pipeline modules ──────────────────────────────────────────────────────────
do_rnaseq: true
do_strand_split: true
do_bigwig: false        # strand-specific bigWig coverage tracks (deepTools); off by default

# ── Adapter trimming (ribo-seq) ───────────────────────────────────────────────
clip_arguments: '-u 1 -a CTGTAGGCACCATCAAT --overlap=4 --trimmed-only --maximum-length=40 --minimum-length=15 --quality-cutoff=28'
dedup_method: "position"
umi_tools_extract_arguments: ""
umicollapse_arguments: ""

# ── Alignment ─────────────────────────────────────────────────────────────────
alignment_arguments:
   filter: '-L 15 --no-unal --norc'        # bowtie2 filter flags
   transcriptome: '-L 15 --no-unal --norc' # bowtie2 transcriptome flags
   # note: alignment_arguments.genome is unused — genome alignment is STAR, configured via star.ribo_arguments

star:
   output_transcriptome_bam: false
   ribo_arguments: '--alignEndsType EndToEnd --seedSearchStartLmax 15 --outFilterType Normal --outFilterMultimapNmax 20 --alignSJDBoverhangMin 1 --outFilterMismatchNoverReadLmax 0.04 --winAnchorMultimapNmax 150'
   # RNA-seq: ENCODE flags; multimappers retained here, unique-only enforced downstream.
   rnaseq_arguments: '--outFilterType BySJout --outFilterMultimapNmax 20 --alignSJoverhangMin 8 --alignSJDBoverhangMin 1 --outFilterMismatchNmax 999 --outFilterMismatchNoverReadLmax 0.04 --alignIntronMin 20 --alignIntronMax 1000000 --alignMatesGapMax 1000000'
   #
   # ── Index-generation settings (only used when genome_fasta + gtf are set below) ──
   # Uncomment and set these when using build-from-FASTA mode:
   #   sjdb_overhang: 28        # read_length - 1; adjust to your library's read length
   #   index_dir: /path/to/cache  # recommended: built index is reused across runs (avoids rebuild on resume)
   #   index_args: ''           # extra genomeGenerate flags; set '--genomeSAindexNbases 7' for very small genomes only

# ── Alignment path selection ──────────────────────────────────────────────────
genome:
  run: true
  unique_only: true   # FILTER: keep uniquely-mapping reads only (-q 255); stats use the unique-only layout
  mapping_quality_cutoff: 255   # FILTER -q, used only when unique_only: false
  samtools_filter_arguments: "-F 2308"   # -F = flags to EXCLUDE: unmapped(4)+secondary(256)+supplementary(2048)
  # ^ any samtools view read-filtering args (-f/-F/-G/-e/-d/-L/-s/…). -q is NOT
  #   accepted here: unique_only / mapping_quality_cutoff own the MAPQ filter and the stats mode.
  # OPTIONAL — unused while unique_only: true, and these are the defaults anyway:
  # samtools_count_arguments:          # how stats.csv COUNTS the kept reads (samtools view -c); no effect on the BAM
  #   primary:   "-F 2304"             #   one record per aligned read (not secondary/supplementary)
  #   secondary: "-f 256"              #   extra alignments of multi-mappers
  #   unique:    "-q 255 -F 2304"      #   what the unique/multi breakdown calls "unique" (STAR MAPQ 255);
  #                                    #   only used when unique_only: false

# ── Bowtie2 transcriptome → ribopy .ribo ─────────────────────────────────────
transcriptome:
  run: true
  mapping_quality_cutoff: 10   # bowtie2: 10=confident; 20=more strict; 40=unique only
  samtools_filter_arguments: "-F 2308"   # own key — no longer inherits the genome route's mask

ribo:
  ref_name: appris_human_v3
  metagene_radius: 50
  left_span: 35
  right_span: 15
  read_length:
    min: 15
    max: 35
  coverage: true
  # ── Optional metadata embedded into .ribo files ───────────────────────────
  # ribometa: ./example_position_multi.yaml  # global: same YAML embedded in every .ribo
  #
  # metadata:                                # per-sample: different YAML per sample
  #   base: ""                               # optional path prefix for all files below
  #   files:                                 # NOTE: write these yourself — meta/ ships
  #     GSM1606107: ./meta/GSM1606107.yaml   # only GSM8325903/07. Sample name must
  #     GSM1606108: ./meta/GSM1606108.yaml   # match the input.fastq key.
  #
  # Both are optional and independent. Per-sample metadata takes precedence over any
  # global ribo.expmeta if both are set. Use `ribopy meta info <sample>.ribo` to verify.

# ── Input — references and FASTQs (ribo-seq) ──────────────────────────────────
input:
   reference:
      filter: ./references_for_riboflow/filter/human/v2/human_rtRNA*

      # ── STAR genome index — pick ONE of the two modes below ──────────────────
      #
      # MODE A — Pre-built index (you already have a STAR index directory):
      #   Set 'genome' to the index directory path.
      #   Leave genome_fasta and gtf absent.
      #   star.sjdb_overhang / star.index_dir / star.index_args are ignored.
      genome: ./rf_sample_data/genome/star_index
      #
      # MODE B — Build index from FASTA+GTF (pipeline runs genomeGenerate first):
      #   Comment out 'genome' above and uncomment the three lines below.
      #   Also uncomment star.sjdb_overhang (and optionally star.index_dir) in the star: block above.
      # genome_fasta: /path/to/GRCh38.primary_assembly.genome.fa
      # gtf:          /path/to/gencode.v48.annotation.gtf

      transcriptome: ./references_for_riboflow/transcriptome/human/v3/riboflow_annot_and_ref/appris_human_v3_selected*
      regions: ./references_for_riboflow/transcriptome/human/v3/riboflow_annot_and_ref/appris_human_v3_actual_regions.bed
      transcript_lengths: ./references_for_riboflow/transcriptome/human/v3/riboflow_annot_and_ref/appris_human_v3_transcript_lengths.tsv

   fastq_base: ""

   fastq:
      GSM1606107:
        - ./rf_sample_data/fastq/ribosome_profiling/GSM1606107/SRR1795425.fastq.gz
        - ./rf_sample_data/fastq/ribosome_profiling/GSM1606107/SRR1795426.fastq.gz
      GSM1606108:
        - ./rf_sample_data/fastq/ribosome_profiling/GSM1606108/SRR1795427.fastq.gz
        - ./rf_sample_data/fastq/ribosome_profiling/GSM1606108/SRR1795428.fastq.gz


# ── RNA-seq path ──────────────────────────────────────────────────────────────
rnaseq:
  fastq_base: ""
  clip_arguments: '-u 1 --quality-cutoff=28 --minimum-length=20'
  filter_arguments: '-L 15 --no-unal'
  dedup_method: "position"          # position | none | umicollapse (SE only)
  umi_tools_extract_arguments: ""
  genome:
    unique_only: true               # FILTER: unique reads only (-q 255); cutoff below is then ignored
    mapping_quality_cutoff: 255     # FILTER -q, used only when unique_only: false
    samtools_filter_arguments: "-F 2308"   # exclude unmapped(4)+secondary(256)+supplementary(2048)
    # OPTIONAL — unused while unique_only: true; defaults shown (PE keys apply automatically):
    # samtools_count_arguments:        # how stats.csv COUNTS the kept reads; PE keys exist only here
    #   primary:   "-F 2304"          #   one record per aligned read
    #   secondary: "-f 256"           #   extra alignments of multi-mappers
    #   unique:    "-q 255 -F 2304"   #   definition of "unique" in the breakdown; used only when unique_only: false
    #   paired_end_fragment:  "-f 64"  #   PE: count R1 only, so counts are per fragment not per mate
    #   paired_end_secondary: "-f 320" #   PE: secondary records, R1 only
  transcriptome:
    mapping_quality_cutoff: 10
    samtools_filter_arguments: "-F 2308"
    alignment_arguments: '-L 15 --no-unal'
  fastq:
    # Sample names must match the ribo-seq sample names so RIBOPY_RNASEQ_SET can
    # merge the RNA-seq BED into the matching .ribo.
    #
    # SE lane = a plain string; PE lane = a 2-element [R1, R2] list.
    GSM1606107:
      - ./rf_sample_data/fastq/ribosome_profiling/GSM1606107/SRR1795425.fastq.gz
      - ./rf_sample_data/fastq/ribosome_profiling/GSM1606107/SRR1795426.fastq.gz
    GSM1606108:
      - ./rf_sample_data/fastq/ribosome_profiling/GSM1606108/SRR1795427.fastq.gz
      - ./rf_sample_data/fastq/ribosome_profiling/GSM1606108/SRR1795428.fastq.gz

# ── Output directories ────────────────────────────────────────────────────────
output:
   individual_lane_directory: 'individual'
   merged_lane_directory: 'merged'
   intermediates:
      base: 'position_intermediates'
      clip: 'clip'
      log: 'log'
      transcriptome_alignment: 'transcriptome_alignment'
      filter: 'filter'
      genome_alignment: 'genome_alignment'
      bam_to_bed: 'bam_to_bed'
      quality_filter: 'quality_filter'
      alignment_ribo: 'alignment_ribo'
   output:
      base: 'position_output'
      log: 'log'
      fastqc: 'fastqc'
      stats: 'stats'
      bigwigs: 'bigwigs'
      alignments: 'alignments'
      ribo: 'ribo'