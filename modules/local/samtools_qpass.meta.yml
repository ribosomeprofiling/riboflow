name: SAMTOOLS_QPASS
description: Quality-pass filter (MAPQ + FLAG) + counts. ext.unsorted skips the index (STAR transcriptome-projection BAM, kept read-name grouped).
keywords: [samtools, filter, mapq]
input:
  - meta: { type: map }
  - bam:  { type: file }
output:
  - bam:    { description: "[meta, *.qpass.bam, *.qpass.bam.bai]" }
  - counts: { description: "[meta, total, primary, secondary]" }
ext:
  - prefix, unsorted
